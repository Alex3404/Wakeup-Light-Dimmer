[package]
edition = "2024"
name = "arduino-esp32-dimmer"
rust-version = "1.88"
version = "0.1.0"

[[bin]]
name = "arduino-esp32-dimmer"
path = "./src/bin/main.rs"

[dependencies]
esp-hal = { version = "~1.0", features = ["esp32s3", "log-04", "unstable"] }

esp-rtos = { version = "0.2.0", features = [
  "embassy",
  "esp-alloc",
  "esp-radio",
  "esp32s3",
  "log-04",
] }

esp-bootloader-esp-idf = { version = "0.4.0", features = ["esp32s3", "log-04"] }
log = "0.4.27"

embassy-net = { version = "0.7.1", features = [
  "dhcpv4",
  "log",
  "medium-ethernet",
  "tcp",
  "udp",
] }
embedded-io = "0.7.1"
embedded-io-async = "0.7.0"
esp-alloc = "0.9.0"
esp-backtrace = { version = "0.18.1", features = [
  "esp32s3",
  "panic-handler",
  "println",
] }
esp-println = { version = "0.16.1", features = ["esp32s3", "log-04"] }
# for more networking protocol support see https://crates.io/crates/edge-net
bleps = { git = "https://github.com/bjoernQ/bleps", package = "bleps", rev = "a5148d8ae679e021b78f53fd33afb8bb35d0b62e", features = [
  "async",
  "macros",
] }
embassy-executor = { version = "0.10.0", features = ["log"] }
embassy-time = { version = "0.5.1", features = ["log"] }
esp-radio = { version = "0.17.0", features = [
  "ble",
  "coex",
  "esp-alloc",
  "esp32s3",
  "log-04",
  "unstable",
  "wifi",
] }
trouble-host = { version = "0.6.0", features = ["default-packet-pool-mtu-255"] }

embassy-time-driver = "0.2.2"
embassy-futures = "0.1.2"
critical-section = "1.2.0"
static_cell = "2.1.1"
libm = "0.2.16"
paste = "1.0.15"
heapless = "0.9.2"
embassy-sync = "0.8.0"
embedded-graphics = "0.8.2"
display-interface-spi = "0.5.0"
embedded-hal-async = "1.0.0"
embedded-hal-bus = "0.3.0"
embassy-embedded-hal = "0.6.0"
ssd1306 = { version = "0.10.0", features = ["async"] }
display-interface = "0.5.0"
enumset = "1.1.10"
esp-storage = { version = "0.8.1", features = ["esp32s3"] }
embedded-storage-async = "0.4.1"
postcard = { version = "1.1.3", features = ["heapless"] }
serde = { version = "1.0.228", default-features = false }
sequential-storage = { version = "7.2.0", features = ["heapless", "postcard"] }

[profile.dev]
# Rust debug is too slow.
# For debug builds always builds with some optimization
opt-level = "s"

[profile.release]
codegen-units = 1        # LLVM can perform better optimizations using a single thread
debug = 2
debug-assertions = false
incremental = false
lto = 'fat'
opt-level = 's'
overflow-checks = false

[patch."https://github.com/esp-rs/esp-pacs"]
esp32s3 = { path = "../esp-pacs-mcpwm/esp32s3" }

# Patch for the updated esp hal created by me
[patch.crates-io]
esp-alloc = { path = "../esp-hal-mcpwm-cap/esp-alloc" }
esp-backtrace = { path = "../esp-hal-mcpwm-cap/esp-backtrace" }
esp-bootloader-esp-idf = { path = "../esp-hal-mcpwm-cap/esp-bootloader-esp-idf" }
esp-hal = { path = "../esp-hal-mcpwm-cap/esp-hal" }
esp-println = { path = "../esp-hal-mcpwm-cap/esp-println" }
esp-radio = { path = "../esp-hal-mcpwm-cap/esp-radio" }
esp-rtos = { path = "../esp-hal-mcpwm-cap/esp-rtos" }
esp-storage = { path = "../esp-hal-mcpwm-cap/esp-storage" }
