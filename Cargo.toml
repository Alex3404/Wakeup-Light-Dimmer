[package]
edition = "2024"
name = "arduino-esp32-dimmer"
rust-version = "1.88"
version = "0.1.0"

[[bin]]
name = "arduino-esp32-dimmer"
path = "./src/bin/main.rs"
test = false

[[test]]
harness = false
name = "hello_test"

[lib]
test = false

[dependencies]
esp-hal = { version = "~1.0", features = ["defmt", "esp32c6", "unstable"] }

esp-rtos = { version = "0.2.0", features = [
  "defmt",
  "embassy",
  "esp-alloc",
  "esp-radio",
  "esp32c6",
] }

defmt = "1.0.1"
esp-bootloader-esp-idf = { version = "0.4.0", features = ["defmt", "esp32c6"] }

embassy-net = { version = "0.7.1", features = [
  "defmt",
  "dhcpv4",
  "medium-ethernet",
  "tcp",
  "udp",
] }
embedded-io = { version = "0.7.1", features = ["defmt"] }
embedded-io-async = { version = "0.7.0", features = ["defmt"] }
esp-alloc = { version = "0.9.0", features = ["defmt"] }
panic-rtt-target = { version = "0.2.0", features = ["defmt"] }
rtt-target = { version = "0.6.2", features = ["defmt"] }
# for more networking protocol support see https://crates.io/crates/edge-net
bt-hci = "0.6.0"
embassy-executor = { version = "0.10.0" }
embassy-time = { version = "0.5.1" }
esp-radio = { version = "0.17.0", features = [
  "ble",
  "coex",
  "esp-alloc",
  "esp32c6",
  "unstable",
  "wifi",
] }
trouble-host = { version = "0.5.0", features = ["gatt"] }

embassy-time-driver = "0.2.2"
embassy-futures = "0.1.2"
libm = "0.2.16"
paste = "1.0.15"
heapless = "0.9.2"
embassy-sync = "0.8.0"
embedded-graphics = "0.8.2"
display-interface-spi = "0.5.0"
embedded-hal-async = "1.0.0"
embedded-hal-bus = "0.3.0"
embassy-embedded-hal = "0.6.0"
ssd1306 = { version = "0.10.0", features = ["async"] }
display-interface = "0.5.0"
enumset = "1.1.10"
esp-storage = { version = "0.8.1", features = ["esp32c6"] }
embedded-storage-async = "0.4.1"
postcard = { version = "1.1.3", features = ["heapless"] }
serde = { version = "1.0.228", default-features = false }
sequential-storage = { version = "7.2.0", features = ["heapless", "postcard"] }
modular-bitfield = "0.13.1"
kolibri-embedded-gui = { git = "https://github.com/Yandrik/kolibri", version = "0.1.0" }
bilge = "0.3.0"

critical-section = "1.2.0"
static_cell = "2.1.1"
embedded-hal = "1.0.0"
strum = { version = "0.28.0", default-features = false }
strum_macros = { version = "0.28.0", default-features = false }
ds1307 = "0.6.0"

[dev-dependencies]
embedded-test = { version = "0.7.0", features = [
  "defmt",
  "embassy",
  "external-executor",
] }

[profile.dev]
# Rust debug is too slow.
# For debug builds always builds with some optimization
opt-level = "s"

[profile.release]
codegen-units = 1        # LLVM can perform better optimizations using a single thread
debug = 2
debug-assertions = false
incremental = false
lto = 'fat'
opt-level = 's'
overflow-checks = false

[patch."https://github.com/esp-rs/esp-pacs"]
esp32c6 = { path = "../esp-pacs-mcpwm/esp32c6" }

# Patch for the updated esp hal created by me
[patch.crates-io]
esp-alloc = { path = "../esp-hal-mcpwm-cap/esp-alloc" }
esp-backtrace = { path = "../esp-hal-mcpwm-cap/esp-backtrace" }
esp-bootloader-esp-idf = { path = "../esp-hal-mcpwm-cap/esp-bootloader-esp-idf" }
esp-hal = { path = "../esp-hal-mcpwm-cap/esp-hal" }
esp-radio = { path = "../esp-hal-mcpwm-cap/esp-radio" }
esp-rtos = { path = "../esp-hal-mcpwm-cap/esp-rtos" }
esp-storage = { path = "../esp-hal-mcpwm-cap/esp-storage" }
